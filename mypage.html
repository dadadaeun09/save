<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마이 페이지 · 저축 앱</title>
<style>
  :root {
    --bg: #fff; --card: #fff; --text: #5a9e78; --muted: #8a9a91; --line: #cfe9da;
    --primary: #4caf7d; --primary-dark: #3d9468; --soft: #f1f9f4; --good: #4caf7d; --bad: #e57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input { font: inherit; color: inherit; background: var(--card); padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent); border-color: var(--primary); }
  .btn { padding: 11px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; width: 100%; }
  .btn.small { width: auto; padding: 6px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--bad); font-size: 13px; margin: 0; }
  .bad { color: var(--bad); }

  #app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 16px 16px 90px; }
  .head { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
  .head h2 { margin: 0; font-size: 20px; }
  .back { background: none; border: 0; font-size: 22px; padding: 4px 8px 4px 0; line-height: 1; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card.flush { padding: 4px 16px; }

  /* 마이 페이지 목록 */
  .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
    padding: 14px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; font-size: 15px; }
  .item:first-child { border-top: 0; }
  .item .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item .chev { color: var(--muted); font-size: 18px; }
  .item.danger { color: var(--bad); }
  .badge { background: var(--primary); color: #fff; border-radius: 99px; font-size: 12px; padding: 1px 8px; margin-right: 6px; }
  .profile { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: #fff;
    display: grid; place-items: center; font-size: 20px; font-weight: 700; flex: none; }
  .profile .name { font-size: 18px; font-weight: 700; }
  .name-edit { display: flex; gap: 6px; margin-top: 10px; }

  /* 폼 */
  form.stack { display: grid; gap: 14px; }
  form.stack label { display: grid; gap: 6px; font-size: 14px; }
  .req { color: var(--bad); }
  .opt { color: var(--muted); font-size: 12px; }

  /* 구매 보류 */
  .held { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .held:first-child { border-top: 0; }
  .held .row { display: flex; justify-content: space-between; gap: 8px; }
  .held .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 30px 0; color: var(--muted); font-size: 14px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 9px 16px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: .92; }

  /* 하단 네비게이션 (홈 화면과 동일) */
  nav#tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom); }
  nav#tabbar .inner { display: flex; width: 100%; max-width: 520px; }
  nav#tabbar a { flex: 1; color: var(--muted); text-decoration: none; padding: 9px 0 8px;
    display: grid; gap: 2px; justify-items: center; font-size: 11px; }
  nav#tabbar a span { font-size: 21px; line-height: 1; }
  nav#tabbar a.active { color: var(--primary); font-weight: 700; }

  /* ---------- 팀 초록 테마 (home.html / login.html / gruop.html과 통일) ---------- */
  h2, .card h3 { color: var(--primary); }
  .card { box-shadow: none; border: 2px solid var(--line); }
  .big { color: var(--primary); }
  .big.good { color: var(--good); } .big.bad { color: var(--bad); }
  input, select { border-width: 2px; border-color: var(--line); }
  .btn:hover { background: var(--primary-dark); }
  .bar { background: var(--line); }
  .back, .item { color: var(--text); }
  nav#tabbar { border-top-width: 2px; }
  nav#tabbar button, nav#tabbar a { padding: 16px 4px; font-size: 14px; display: block; text-align: center; white-space: nowrap; }
  nav#tabbar button span, nav#tabbar a span { display: none; }
  nav#tabbar button.active, nav#tabbar a.active, nav#tabbar button:hover, nav#tabbar a:hover { background: var(--soft); color: var(--primary); font-weight: 700; }
</style>
<link rel="stylesheet" href="polish.css" />
</head>
<body>
<div id="app">

  <!-- 마이 페이지 메인 -->
  <section id="view-main">
    <div class="head"><h2>마이 페이지</h2></div>

    <div class="card">
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div style="flex:1;min-width:0">
          <div class="name" id="user-name"></div>
          <div class="muted">사용자 이름</div>
        </div>
        <button class="btn ghost small" id="name-edit-btn">수정</button>
      </div>
      <form class="name-edit" id="name-form" hidden>
        <input id="name-input" maxlength="20" placeholder="이름 입력" required />
        <button class="btn small" type="submit">저장</button>
      </form>
    </div>

    <div class="card flush">
      <button class="item" data-go="goal">
        <span>저축 목표 설정<span class="sub" id="sub-goal"></span></span><span class="chev">›</span>
      </button>
      <button class="item" data-go="income">
        <span>소득 수준 설정<span class="sub" id="sub-income"></span></span><span class="chev">›</span>
      </button>
      <button class="item" data-go="held">
        <span>구매 보류 품목<span class="sub" id="sub-held"></span></span>
        <span><span class="badge" id="held-badge"></span><span class="chev">›</span></span>
      </button>
    </div>

    <div class="card flush">
      <button class="item" id="reset-data"><span>저축 데이터 초기화<span class="sub">현재 저축액, 아낀 금액, 충동구매를 0원으로 되돌려요</span></span></button>
      <button class="item" id="logout">로그아웃</button>
      <button class="item danger" id="withdraw">회원 탈퇴</button>
    </div>
  </section>

  <!-- 저축 목표 설정 -->
  <section id="view-goal" hidden>
    <div class="head"><button class="back" data-go="main" aria-label="뒤로">‹</button><h2>저축 목표 설정</h2></div>
    <div class="card">
      <form class="stack" id="goal-form" novalidate>
        <label>저축 목적 <span class="req">*</span>
          <input name="name" maxlength="30" placeholder="예: 유럽 여행, 노트북 구매" />
        </label>
        <label>목표 금액 (원) <span class="req">*</span>
          <input name="target" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 3000000" />
        </label>
        <label>목표 기한 <span class="opt">(선택)</span>
          <input name="deadline" type="date" />
        </label>
        <p class="muted" style="margin:0">기한을 비워 두면 월 소득의 20%를 저축한다고 가정해 계산합니다.</p>
        <p class="error" id="goal-error" hidden></p>
        <button class="btn" type="submit">저장</button>
      </form>
    </div>
  </section>

  <!-- 소득 수준 설정 -->
  <section id="view-income" hidden>
    <div class="head"><button class="back" data-go="main" aria-label="뒤로">‹</button><h2>소득 수준 설정</h2></div>
    <div class="card">
      <form class="stack" id="income-form" novalidate>
        <label>이번 달 소득 (원) <span class="req">*</span>
          <input name="income" type="number" inputmode="numeric" min="1" step="1" placeholder="예: 2500000" />
        </label>
        <p class="muted" style="margin:0">현재 월에 버는 금액을 입력하세요. AI가 구매 금액을 근무 시간으로 환산할 때 사용합니다.</p>
        <p class="error" id="income-error" hidden></p>
        <button class="btn" type="submit">저장</button>
      </form>
    </div>
  </section>

  <!-- 구매 보류 품목 -->
  <section id="view-held" hidden>
    <div class="head"><button class="back" data-go="main" aria-label="뒤로">‹</button><h2>구매 보류 품목</h2></div>
    <p class="muted" style="margin-top:0">AI 채팅에서 설득에도 구매를 보류하기로 한 품목입니다.</p>
    <div class="card" id="held-card"></div>
  </section>

  <nav id="tabbar"><div class="inner">
    <a href="home.html"><span>🏠</span>홈</a>
    <a href="index.html#chat"><span>💬</span>AI 채팅</a>
    <a href="index.html#group"><span>👥</span>그룹</a>
    <a href="mypage.html" class="active"><span>👤</span>마이</a>
  </div></nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const todayStr = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

/* index.html과 같은 localStorage 키("data")를 공유한다 */
/* 로그인 정보 (login.html과 같은 저장 방식) */
function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
function clearCurrentUser() {
  try { localStorage.removeItem("currentUser"); sessionStorage.removeItem("currentUser"); } catch {}
}
const user = getCurrentUser();
if (!user) location.replace("login.html");

let data = load("data", null) || {
  goal: { name: "", target: 0, saved: 0, deadline: "", income: 0 },
  resisted: [], impulse: [], held: [], history: [],
};
data.held ??= [];
const persist = () => localStorage.setItem("data", JSON.stringify(data));

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 화면 전환 (#goal, #income, #held) ---------- */
const VIEWS = ["main", "goal", "income", "held"];
function route() {
  const v = location.hash.slice(1);
  const view = VIEWS.includes(v) ? v : "main";
  VIEWS.forEach((n) => $("view-" + n).hidden = n !== view);
  if (view === "main") renderMain();
  if (view === "goal") fillGoal();
  if (view === "income") fillIncome();
  if (view === "held") renderHeld();
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => {
  location.hash = b.dataset.go === "main" ? "" : b.dataset.go;
  if (b.dataset.go === "main" && !location.hash) route(); // 해시가 이미 비어 있어도 갱신
});
window.addEventListener("hashchange", route);

/* ---------- 메인 ---------- */
function renderMain() {
  const name = (user && user.name) || "사용자";
  $("user-name").textContent = name;
  $("avatar").textContent = name.slice(0, 1);
  const g = data.goal;
  $("sub-goal").textContent = g.name ? `${g.name} · ${won(g.target)}${g.deadline ? " · " + g.deadline : ""}` : "아직 설정하지 않았어요";
  $("sub-income").textContent = g.income ? `월 ${won(g.income)}` : "아직 설정하지 않았어요";
  const n = data.held.length;
  $("sub-held").textContent = n ? `${n}개 품목 보류 중` : "보류 중인 품목이 없어요";
  $("held-badge").textContent = n; $("held-badge").hidden = !n;
}
$("name-edit-btn").onclick = () => {
  $("name-form").hidden = !$("name-form").hidden;
  $("name-input").value = (user && user.name) || ""; $("name-input").focus();
};
$("name-form").onsubmit = async (e) => {
  e.preventDefault();
  const v = $("name-input").value.trim(); if (!v) return;
  const { error } = await sbApp.client.auth.updateUser({ data: { name: v } });
  if (error) { toast("이름 변경에 실패했어요"); return; }
  user.name = v;
  const store = sessionStorage.getItem("currentUser") ? sessionStorage : localStorage;
  store.setItem("currentUser", JSON.stringify(user));
  $("name-form").hidden = true; renderMain(); toast("이름이 변경되었습니다");
};

/* ---------- 저축 목표 ---------- */
function fillGoal() {
  const f = $("goal-form").elements, g = data.goal;
  f.name.value = g.name || ""; f.target.value = g.target || ""; f.deadline.value = g.deadline || "";
  f.deadline.min = todayStr(); $("goal-error").hidden = true;
}
$("goal-form").onsubmit = (e) => {
  e.preventDefault();
  const f = e.target.elements, err = $("goal-error");
  const name = f.name.value.trim(), target = Number(f.target.value), deadline = f.deadline.value;
  const fail = (m) => { err.textContent = m; err.hidden = false; };
  if (!name) return fail("저축 목적을 입력해 주세요.");
  if (!(target >= 1)) return fail("목표 금액을 1원 이상으로 입력해 주세요.");
  if (deadline && deadline < todayStr()) return fail("기한은 오늘 이후 날짜로 설정해 주세요.");
  data.goal = { ...data.goal, name, target: Math.round(target), deadline };
  persist(); toast("저축 목표가 저장되었습니다"); location.hash = "";
  if (!location.hash) route();
};

/* ---------- 소득 수준 ---------- */
function fillIncome() { $("income-form").elements.income.value = data.goal.income || ""; $("income-error").hidden = true; }
$("income-form").onsubmit = (e) => {
  e.preventDefault();
  const v = Number(e.target.elements.income.value), err = $("income-error");
  if (!(v >= 1)) { err.textContent = "소득을 1원 이상으로 입력해 주세요."; err.hidden = false; return; }
  data.goal = { ...data.goal, income: Math.round(v) };
  persist(); toast("소득 수준이 저장되었습니다"); location.hash = "";
  if (!location.hash) route();
};

/* ---------- 구매 보류 품목 ---------- */
function renderHeld() {
  const el = $("held-card");
  if (!data.held.length) { el.innerHTML = '<div class="empty">보류 중인 품목이 없습니다.<br>AI 채팅에서 구매를 보류하면 여기에 표시돼요.</div>'; return; }
  el.innerHTML = data.held.map((h, i) => {
    const days = Math.floor((new Date(todayStr()) - new Date(h.date)) / 86400000);
    return `<div class="held">
      <div class="row"><b>${esc(h.item)}</b><b>${won(h.amount)}</b></div>
      <div class="muted">${esc(h.date)} 보류 · ${days}일째</div>
      <div class="actions">
        <button class="btn small" data-act="skip" data-i="${i}">구매 안 함</button>
        <button class="btn ghost small" data-act="buy" data-i="${i}">그래도 구매</button>
      </div></div>`;
  }).join("");
}
$("held-card").onclick = (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const i = +b.dataset.i, h = data.held[i];
  if (b.dataset.act === "skip") { data.resisted.push({ item: h.item, amount: h.amount, date: todayStr() }); toast("아낀 금액에 반영했습니다"); }
  else { data.impulse.push({ item: h.item, amount: h.amount, date: todayStr() }); toast("충동구매로 기록했습니다"); }
  data.held.splice(i, 1); persist(); renderHeld();
};

/* ---------- 저축 데이터 초기화 ---------- */
/* 목표(이름·금액·기한)와 소득, 보류 품목은 그대로 두고 금액 기록만 0으로 되돌려요. */
$("reset-data").onclick = () => {
  if (!confirm("현재 저축액, 아낀 금액, 충동구매, 저축 내역이 모두 0원으로 초기화됩니다.\n목표와 소득 설정은 그대로 유지돼요. 되돌릴 수 없습니다.\n초기화할까요?")) return;
  data.goal.saved = 0;
  data.resisted = [];
  data.impulse = [];
  data.savings = [];
  persist(); renderMain(); toast("저축 데이터가 0원으로 초기화되었습니다");
};

/* ---------- 로그아웃 / 회원 탈퇴 ---------- */
$("logout").onclick = async () => {
  if (!confirm("로그아웃 하시겠어요?")) return;
  await sbApp.client.auth.signOut();
  localStorage.removeItem("data");
  clearCurrentUser();
  location.href = "login.html";
};
$("withdraw").onclick = async () => {
  if (!confirm("회원 탈퇴 시 저장된 모든 데이터(목표, 소비 기록 등)가 삭제되며 되돌릴 수 없습니다.\n정말 탈퇴하시겠어요?")) return;
  const { error } = await sbApp.client.rpc("delete_my_account"); // 계정과 저장된 데이터를 함께 삭제
  if (error) { alert("탈퇴에 실패했어요: " + error.message); return; }
  await sbApp.client.auth.signOut();
  localStorage.removeItem("data");
  clearCurrentUser();
  alert("탈퇴가 완료되었습니다.");
  location.href = "login.html";
};

route();
</script>
</body>
</html>
