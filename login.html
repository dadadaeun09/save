<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈모으기운동 - 로그인</title>
<style>
  :root {
    --green: #4caf7d; --green-dark: #3d9468; --pastel: #6fb98f; --pastel-text: #5a9e78;
    --pastel-light: #cfe9da; --pastel-bg: #f1f9f4; --white: #fff; --gray: #8a9a91; --red: #e57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--white); color: var(--pastel-text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  .box { width: 100%; max-width: 380px; text-align: center; border: 2px solid var(--pastel-light);
    border-radius: 14px; padding: 28px 22px; }
  h1 { margin: 0 0 6px; color: var(--green); font-size: 28px; }
  .muted { color: var(--gray); font-size: 14px; margin: 0; }
  .tabs { display: flex; margin: 20px 0 8px; background: var(--pastel-bg); border-radius: 12px; padding: 4px; }
  .tabs button { flex: 1; padding: 10px; border: 0; border-radius: 10px; background: none; font: inherit;
    color: var(--pastel-text); cursor: pointer; }
  .tabs button.active { background: var(--white); color: var(--green); font-weight: 700; }
  form { text-align: left; }
  [hidden] { display: none !important; }
  label { display: block; font-size: 14px; margin: 12px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 2px solid var(--pastel-light); border-radius: 10px;
    font: inherit; color: #3f6b52; outline: none; }
  input:focus { border-color: var(--pastel); }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  label.check input { width: auto; }
  .error { color: var(--red); font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  .btn { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--green); color: #fff;
    font: inherit; cursor: pointer; }
  .btn:hover { background: var(--green-dark); }
</style>
<link rel="stylesheet" href="polish.css" />
</head>
<body>

<div class="box">
  <h1>돈모으기운동</h1>
  <p class="muted">목표한 돈, AI와 함께 똑똑하게 모아요</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">로그인</button>
    <button id="signupTab" type="button">회원가입</button>
  </div>

  <form id="loginForm">
    <label for="loginEmail">이메일</label>
    <input type="email" id="loginEmail" placeholder="example@email.com" required />
    <label for="loginPassword">비밀번호</label>
    <input type="password" id="loginPassword" placeholder="비밀번호" required />
    <label class="check" style="margin-top:14px"><input type="checkbox" id="autoLogin" /> 자동 로그인</label>
    <p class="error" id="loginError"></p>
    <button type="submit" class="btn">로그인</button>
  </form>

  <form id="signupForm" hidden>
    <label for="signupName">이름(닉네임)</label>
    <input type="text" id="signupName" placeholder="닉네임" required />
    <label for="signupEmail">이메일</label>
    <input type="email" id="signupEmail" placeholder="example@email.com" required />
    <label for="signupPassword">비밀번호</label>
    <input type="password" id="signupPassword" placeholder="6자 이상" minlength="6" required />
    <label for="signupPassword2">비밀번호 확인</label>
    <input type="password" id="signupPassword2" placeholder="비밀번호 다시 입력" required />
    <p class="error" id="signupError"></p>
    <button type="submit" class="btn">회원가입</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
/* 가입 정보와 비밀번호는 Supabase(Auth)가 안전하게 저장합니다. (supabase.js 참고)
   이 브라우저에는 currentUser = {email, name} 만 남겨 다른 페이지가 로그인 여부를 확인합니다.
   - 자동 로그인 체크 → localStorage(브라우저를 껐다 켜도 유지)
   - 체크 안 함       → sessionStorage(브라우저를 닫으면 로그아웃) */
const sb = window.sbApp.client;
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
/* 로그인 후 돌아갈 페이지 (?next=group.html). 사이트 안의 .html 파일만 허용 */
const nextPage = (() => {
  const n = new URLSearchParams(location.search).get("next") || "";
  return /^[\w-]+\.html$/.test(n) ? n : "home.html";
})();
if (getCurrentUser()) location.replace(nextPage);

function showTab(login) {
  $("loginTab").classList.toggle("active", login);
  $("signupTab").classList.toggle("active", !login);
  $("loginForm").hidden = !login;
  $("signupForm").hidden = login;
}
$("loginTab").onclick = () => showTab(true);
$("signupTab").onclick = () => showTab(false);

const authMessage = (m) => {
  if (/already registered|already been registered/i.test(m)) return "이미 가입된 이메일이에요.";
  if (/invalid login/i.test(m)) return "이메일 또는 비밀번호가 맞지 않아요.";
  if (/password/i.test(m)) return "비밀번호는 6자 이상이어야 해요.";
  if (/rate limit|too many/i.test(m)) return "잠시 후 다시 시도해 주세요.";
  if (/valid email|invalid.*email/i.test(m)) return "이메일 형식을 확인해 주세요.";
  return "오류가 발생했어요: " + m;
};

$("signupForm").onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target, btn = form.querySelector("button[type=submit]");
  const name = $("signupName").value.trim(), email = $("signupEmail").value.trim();
  const pw = $("signupPassword").value;
  if (pw !== $("signupPassword2").value) { $("signupError").textContent = "비밀번호가 서로 달라요."; return; }
  btn.disabled = true; $("signupError").textContent = "";
  const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name } } });
  btn.disabled = false;
  if (error) { $("signupError").textContent = authMessage(error.message); return; }
  // 이미 가입된 이메일이면 Supabase는 오류 대신 빈 identities를 돌려줍니다
  if (data.user && data.user.identities && data.user.identities.length === 0) {
    $("signupError").textContent = "이미 가입된 이메일이에요."; return;
  }
  await sb.auth.signOut(); // 가입 직후 자동 로그인 상태를 풀고, 아래 안내대로 직접 로그인
  form.reset();
  showTab(true);
  $("loginEmail").value = email;
  $("loginError").textContent = "회원가입이 완료됐어요. 로그인해 주세요.";
};

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  const email = $("loginEmail").value.trim();
  btn.disabled = true; $("loginError").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: $("loginPassword").value });
  btn.disabled = false;
  if (error) { $("loginError").textContent = authMessage(error.message); return; }
  const user = data.user;
  // 다른 계정으로 바꿔 로그인하면 이전 계정의 데이터가 섞이지 않게 비움
  try {
    if (localStorage.getItem("lastUserId") && localStorage.getItem("lastUserId") !== user.id) localStorage.removeItem("data");
    localStorage.setItem("lastUserId", user.id);
  } catch {}
  const text = JSON.stringify({ email: user.email, name: (user.user_metadata && user.user_metadata.name) || email.split("@")[0] });
  try { sessionStorage.removeItem("currentUser"); localStorage.removeItem("currentUser"); } catch {}
  (($("autoLogin").checked) ? localStorage : sessionStorage).setItem("currentUser", text);
  location.href = nextPage;
};
</script>
</body>
</html>
