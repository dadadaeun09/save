<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈모으기운동 - 로그인</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #fff; --text: #1c2230; --muted: #6b7487; --line: #e3e7ef;
    --primary: #3b6cff; --good: #1a9b5f; --bad: #d9443b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --card: #1c212c; --text: #e8ecf5; --muted: #9aa3b6; --line: #2c3342; --primary: #6c92ff; --good: #3fcf8e; --bad: #ff7a70; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  input { font: inherit; color: inherit; background: var(--card); padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent); border-color: var(--primary); }
  .box { width: min(380px, 100%); padding: 32px 28px; background: var(--card);
    border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 24px; text-align: center; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; text-align: center; }
  .tabs { display: flex; margin: 20px 0 8px; background: var(--bg); border-radius: 10px; padding: 4px; }
  .tabs button { flex: 1; padding: 9px; border: 0; border-radius: 8px; background: none; color: var(--muted); }
  .tabs button.active { background: var(--card); color: var(--primary); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  form { display: grid; gap: 4px; }
  label { display: block; font-size: 14px; margin: 10px 0 6px; }
  label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
  label.check input { width: auto; }
  .error { color: var(--bad); font-size: 13px; min-height: 18px; margin: 8px 0 0; }
  .btn { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; }
  .btn:hover { filter: brightness(.92); }
</style>
</head>
<body>

<div class="box">
  <h1>돈모으기운동</h1>
  <p class="muted">목표한 돈, AI와 함께 똑똑하게 모아요</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">로그인</button>
    <button id="signupTab" type="button">회원가입</button>
  </div>

  <form id="loginForm">
    <label for="loginEmail">이메일</label>
    <input type="email" id="loginEmail" placeholder="example@email.com" required />
    <label for="loginPassword">비밀번호</label>
    <input type="password" id="loginPassword" placeholder="비밀번호" required />
    <label class="check" style="margin-top:14px"><input type="checkbox" id="autoLogin" /> 자동 로그인</label>
    <p class="error" id="loginError"></p>
    <button type="submit" class="btn">로그인</button>
  </form>

  <form id="signupForm" hidden>
    <label for="signupName">이름(닉네임)</label>
    <input type="text" id="signupName" placeholder="닉네임" required />
    <label for="signupEmail">이메일</label>
    <input type="email" id="signupEmail" placeholder="example@email.com" required />
    <label for="signupPassword">비밀번호</label>
    <input type="password" id="signupPassword" placeholder="6자 이상" minlength="6" required />
    <label for="signupPassword2">비밀번호 확인</label>
    <input type="password" id="signupPassword2" placeholder="비밀번호 다시 입력" required />
    <p class="error" id="signupError"></p>
    <button type="submit" class="btn">회원가입</button>
  </form>
</div>

<script>
/* 주의: 서버가 없어서 계정 정보를 이 브라우저의 localStorage에만 저장합니다.
   비밀번호도 그대로 저장되므로 연습용입니다. 실제 서비스에서는 서버에서 처리해야 합니다.
   저장 위치: users = { 이메일: {name, password} }, currentUser = {email, name}
   - 자동 로그인 체크 → localStorage(브라우저를 껐다 켜도 유지)
   - 체크 안 함       → sessionStorage(브라우저를 닫으면 로그아웃) */
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
if (getCurrentUser()) location.replace("home.html");

function showTab(login) {
  $("loginTab").classList.toggle("active", login);
  $("signupTab").classList.toggle("active", !login);
  $("loginForm").hidden = !login;
  $("signupForm").hidden = login;
}
$("loginTab").onclick = () => showTab(true);
$("signupTab").onclick = () => showTab(false);

$("signupForm").onsubmit = (e) => {
  e.preventDefault();
  const name = $("signupName").value.trim(), email = $("signupEmail").value.trim();
  const pw = $("signupPassword").value;
  if (pw !== $("signupPassword2").value) { $("signupError").textContent = "비밀번호가 서로 달라요."; return; }
  const users = load("users", {});
  if (users[email]) { $("signupError").textContent = "이미 가입된 이메일이에요."; return; }
  users[email] = { name, password: pw };
  localStorage.setItem("users", JSON.stringify(users));
  $("signupError").textContent = "";
  e.target.reset();
  showTab(true);
  $("loginEmail").value = email;
  $("loginError").textContent = "회원가입이 완료됐어요. 로그인해 주세요.";
};

$("loginForm").onsubmit = (e) => {
  e.preventDefault();
  const email = $("loginEmail").value.trim();
  const user = load("users", {})[email];
  if (!user || user.password !== $("loginPassword").value) {
    $("loginError").textContent = "이메일 또는 비밀번호가 맞지 않아요."; return;
  }
  const text = JSON.stringify({ email, name: user.name });
  try { sessionStorage.removeItem("currentUser"); localStorage.removeItem("currentUser"); } catch {}
  (($("autoLogin").checked) ? localStorage : sessionStorage).setItem("currentUser", text);
  location.href = "home.html";
};
</script>
</body>
</html>
