<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPENDICT - Group</title>
<style>
  :root {
    --green: #4caf7d; --green-dark: #3d9468; --pastel: #6fb98f; --pastel-text: #5a9e78;
    --pastel-light: #cfe9da; --pastel-bg: #f1f9f4; --white: #fff; --gray: #8a9a91; --red: #e57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--pastel-text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  a { color: var(--green); text-decoration: none; }
  h2, h3 { color: var(--green); margin: 0 0 10px; }
  h3 { font-size: 16px; }

  /* 상단바 + 석 삼 자 메뉴 */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--white); border-bottom: 2px solid var(--pastel-light); }
  .logo { font-size: 20px; font-weight: 700; color: var(--green); }
  .menu-button { width: 40px; height: 40px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 5px; padding: 0; border: 0; border-radius: 10px; background: none; cursor: pointer; }
  .menu-button span { display: block; width: 22px; height: 3px; border-radius: 2px; background: var(--green); }
  .menu-button:hover { background: var(--pastel-bg); }
  .dropdown { display: none; position: absolute; top: 100%; right: 16px; min-width: 160px; padding: 8px;
    background: var(--white); border: 2px solid var(--pastel-light); border-radius: 14px; }
  .dropdown.open { display: block; }
  .dropdown a, .dropdown button { display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; text-align: left; font: inherit; color: var(--pastel-text); cursor: pointer; }
  .dropdown a.active, .dropdown a:hover, .dropdown button:hover { background: var(--pastel-bg); color: var(--green); font-weight: 700; }
  .dropdown hr { border: 0; border-top: 1px dashed var(--pastel-light); margin: 6px 0; }

  /* 하단 이동바 */
  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
    background: var(--white); border-top: 2px solid var(--pastel-light); padding-bottom: env(safe-area-inset-bottom); }
  .bottom-bar a { flex: 1; padding: 16px 4px; text-align: center; color: var(--pastel-text); white-space: nowrap; }
  .bottom-bar a.active, .bottom-bar a:hover { background: var(--pastel-bg); color: var(--green); font-weight: 700; }

  /* 본문 */
  main { max-width: 720px; margin: 0 auto; padding: 22px 16px 100px; }
  .card { border: 2px solid var(--pastel-light); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card.soft { background: var(--pastel-bg); border-color: transparent; }
  .muted { color: var(--gray); font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; color: var(--green); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .progress { height: 14px; background: var(--pastel-light); border-radius: 999px; overflow: hidden; margin: 10px 0; }
  .progress i { display: block; height: 100%; width: 0; background: var(--green); transition: width .5s; }
  .btn { display: inline-block; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--green); color: #fff;
    font: inherit; cursor: pointer; }
  .btn:hover { background: var(--green-dark); }
  .btn.ghost { background: none; border: 2px solid var(--pastel-light); color: var(--pastel-text); }
  .btn.ghost:hover { background: var(--pastel-bg); }
  .btn.danger { background: none; border: 2px solid var(--red); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 2px solid var(--pastel-light); border-radius: 10px;
    font: inherit; color: var(--pastel-text); margin: 6px 0 10px; }
  input[type=text]:focus { outline: none; border-color: var(--green); }
  .code { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--white); color: var(--green);
    font-weight: 700; letter-spacing: 1px; }

  /* 멤버 목록 */
  .member { padding: 14px 0; border-top: 1px dashed var(--pastel-light); }
  .member:first-child { border-top: 0; }
  .uid { font-weight: 700; color: var(--green); }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px;
    background: var(--pastel-light); color: var(--green-dark); font-weight: 400; }
  .member .progress { height: 10px; margin: 8px 0 4px; }
  .empty { color: var(--gray); font-size: 14px; }
</style>
<link rel="stylesheet" href="polish.css" />
</head>
<body>

<header class="topbar">
  <a class="logo" href="home.html">SPENDICT</a>
  <button class="menu-button" id="menuButton" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  <div class="dropdown" id="dropdown"></div>
</header>

<main>
  <h2 id="welcome">Group</h2>
  <div id="content"></div>
</main>

<nav class="bottom-bar" id="bottomBar"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
const hasGoal = (d) => !!(d && d.goal && d.goal.name && Number(d.goal.target) > 0); // 목표 이름과 금액이 있어야 "목표 있음"
/* 데이터 키
   "data"   : 홈과 동일. { goal:{name,target,saved,deadline,income}, ... }  (그룹 정보는 Supabase DB) */
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 로그인 확인 ---------- */
function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
function logout() {
  try { localStorage.removeItem("currentUser"); sessionStorage.removeItem("currentUser"); } catch {}
  location.href = "login.html";
}
const user = getCurrentUser();
if (!user) location.replace("login.html?next=group.html");

/* ---------- 메뉴 ---------- */
const pages = [
  { name: "홈", href: "home.html" },
  { name: "AI 채팅", href: "index.html#chat" },
  { name: "그룹", href: "group.html", active: true },
  { name: "마이", href: "mypage.html" },
];
const links = pages.map((p) => `<a href="${p.href}" class="${p.active ? "active" : ""}">${p.name}</a>`).join("");
$("bottomBar").innerHTML = links;
$("dropdown").innerHTML = links + `<hr><button type="button" onclick="logout()">로그아웃</button>`;
$("menuButton").onclick = (e) => { e.stopPropagation(); $("dropdown").classList.toggle("open"); };
document.addEventListener("click", () => $("dropdown").classList.remove("open"));

/* ---------- 그룹 데이터 (Supabase) ----------
   그룹/대기열은 Supabase DB에 저장돼 기기·사람이 달라도 매칭돼요. (테이블·함수: supabase_group.sql) */
const sb = window.sbApp.client;
const manwon = (n) => Math.round(n / 10000).toLocaleString("ko-KR") + "만원";
let myUid = null;               // Supabase 로그인 사용자 id
let st = { group: null, members: [], waiting: false };
let notice = "";                // 화면에 띄우는 안내 문구

const rpc = async (fn, args) => {
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    console.warn(fn, error);
    notice = /Could not find the function|does not exist|schema cache/i.test(error.message)
      ? "그룹 기능용 DB 설정(supabase_group.sql)이 아직 적용되지 않았어요."
      : "오류가 발생했어요: " + error.message;
    render(); return { error };
  }
  return { data };
};
const myGoal = () => { const d = load("data", null); return hasGoal(d) ? d.goal : null; };
const goalPct = (g) => Math.min((g.saved / g.target) * 100, 100);
const noGroup = () => ({ group: null, members: [], waiting: false });

async function autoMatch() {
  const g = myGoal();
  if (!g) { notice = "먼저 저축 목표를 설정해 주세요. (마이 탭)"; return render(); }
  const r = await rpc("find_match", { p_target: g.target, p_goal: g.name, p_pct: goalPct(g), p_name: user.name });
  if (r.error) return;
  st = r.data;
  notice = st.group ? "" : "목표금액이 비슷한 사람이 없어서 매칭이 안 됐어요. 비슷한 사람이 매칭을 시작하면 이 페이지를 다시 열었을 때 그룹이 만들어져 있어요.";
  render();
}
async function cancelMatch() {
  const r = await rpc("cancel_match");
  if (r.error) return;
  st = noGroup(); notice = ""; render();
}
async function leaveGroup() {
  if (!confirm("정말 그룹을 나갈까요?")) return;
  const r = await rpc("leave_group");
  if (r.error) return;
  st = noGroup(); notice = ""; render();
}
async function shareProgress() {
  const g = myGoal();
  if (!g) { notice = "먼저 저축 목표를 설정해 주세요. (마이 탭)"; return render(); }
  const r = await rpc("share_progress", { p_goal: g.name, p_pct: goalPct(g) });
  if (!r.error) { st = r.data; notice = ""; render(); }
}
async function stopSharing() {
  const r = await rpc("stop_sharing");
  if (!r.error) { st = r.data; notice = ""; render(); }
}

/* ---------- 화면 ---------- */
function render() {
  const g = st.group;
  const msg = notice ? `<section class="card soft"><p class="muted" style="margin:0">${esc(notice)}</p></section>` : "";

  // 그룹이 없을 때: 자동 매칭 (비슷한 사람이 없으면 안내 메시지)
  if (!g) {
    $("welcome").textContent = "그룹";
    $("content").innerHTML = msg + `
      <section class="card">
        <h3>목표가 비슷한 사람과 자동 매칭</h3>
        <p class="muted">내 목표금액의 ±30% 안에 있는 사람들과 자동으로 그룹이 만들어져요. 그룹에서는 금액이 아닌 달성률만 비교해요.</p>
        <div class="actions">
          <button class="btn" onclick="autoMatch()">${st.waiting ? "다시 매칭하기" : "자동 매칭 시작"}</button>
          ${st.waiting ? '<button class="btn ghost" onclick="cancelMatch()">대기 취소</button>' : ""}
        </div>
        ${st.waiting && !notice ? '<p class="muted">매칭 대기 중이에요. 비슷한 사람이 나타나면 그룹이 만들어져요.</p>' : ""}
      </section>`;
    return;
  }

  const me = st.members.find((m) => m.user_id === myUid) || {};
  $("welcome").textContent = g.name;

  const members = st.members.map((m) => {
    const shared = m.shared_pct !== null && m.shared_pct !== undefined;
    const isMe = m.user_id === myUid;
    return `<div class="member">
      <div class="row">
        <span><span class="uid">@${esc(m.uid)}</span>${isMe ? '<span class="tag">나</span>' : ""}
          <span class="muted"> ${esc(m.name)}</span></span>
        ${shared ? `<b>${Number(m.shared_pct).toFixed(1)}%</b>` : '<span class="muted">미공유</span>'}
      </div>
      ${shared ? `
        <div class="progress"><i style="width:${Number(m.shared_pct)}%"></i></div>
        <div class="row"><span class="muted">${esc(m.shared_goal || "")}</span>
          <span class="muted">${esc(new Date(m.shared_at).toLocaleString("ko-KR"))}</span></div>`
        : '<div class="empty">아직 달성현황을 공유하지 않았어요.</div>'}
    </div>`;
  }).join("");

  const meShared = me.shared_pct !== null && me.shared_pct !== undefined;
  $("content").innerHTML = msg + `
    <section class="card soft">
      <div class="row"><span class="muted">멤버 ${st.members.length}명</span>
        <span class="muted">목표금액 평균 ${manwon(g.avg_target)} 전후</span></div>
      <div class="actions">
        <button class="btn danger" onclick="leaveGroup()">그룹 나가기</button>
      </div>
    </section>

    <section class="card">
      <h3>내 달성현황 공유</h3>
      <p class="muted">홈에 표시되는 저축 목표 달성률을 그룹 멤버에게 보여줘요.</p>
      <div class="actions">
        <button class="btn" onclick="shareProgress()">${meShared ? "현황 새로 공유" : "달성현황 공유하기"}</button>
        ${meShared ? '<button class="btn ghost" onclick="stopSharing()">공유 중지</button>' : ""}
      </div>
    </section>

    <section class="card">
      <h3>멤버 달성현황</h3>
      ${members}
    </section>`;
}

/* ---------- 시작: 로그인 세션 확인 후 내 그룹 불러오기 ---------- */
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { // 서버 세션이 없으면 다시 로그인
    try { localStorage.removeItem("currentUser"); sessionStorage.removeItem("currentUser"); } catch {}
    location.replace("login.html?next=group.html"); return;
  }
  myUid = session.user.id;
  const r = await rpc("my_group_state");
  if (!r.error) st = r.data;
  render();
}
if (user) init();
</script>
</body>
</html>
