<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈모으기운동 - 홈</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #fff; --text: #1c2230; --muted: #6b7487; --line: #e3e7ef;
    --primary: #3b6cff; --good: #1a9b5f; --bad: #d9443b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --card: #1c212c; --text: #e8ecf5; --muted: #9aa3b6; --line: #2c3342; --primary: #6c92ff; --good: #3fcf8e; --bad: #ff7a70; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  a { text-decoration: none; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 90px; }
  h2 { margin: 4px 0 14px; font-size: 20px; }
  h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card.soft { background: var(--card); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid .card { margin-bottom: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .big { font-size: 26px; font-weight: 700; }
  .grid .big { font-size: 20px; white-space: nowrap; }
  #resistedTotal { color: var(--good); }
  .big.red { color: var(--bad); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .progress { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 99px; transition: width .5s; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  ul.list li:first-child { border-top: 0; }
  .bad { color: var(--bad); }
  .btn { display: inline-block; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; margin-top: 8px; }

  /* 하단 네비게이션 */
  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom); }
  .bottom-bar .inner { display: flex; width: 100%; max-width: 520px; }
  .bottom-bar a { flex: 1; color: var(--muted); padding: 9px 0 8px; display: grid; gap: 2px;
    justify-items: center; font-size: 11px; }
  .bottom-bar a span { font-size: 21px; line-height: 1; }
  .bottom-bar a.active { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>

<main>
  <h2 id="welcome"></h2>

  <section class="card soft" id="goalCard"></section>

  <div class="grid">
    <section class="card">
      <h3>현재 저축액</h3>
      <div class="big" id="savedNow"></div>
      <div class="muted" id="monthlyNeed"></div>
    </section>
    <section class="card">
      <h3>아낀 금액</h3>
      <div class="big" id="resistedTotal"></div>
      <div class="muted" id="resistedCount"></div>
    </section>
  </div>

  <section class="card">
    <h3>이번 달 충동구매</h3>
    <div class="row"><div class="big red" id="impulseTotal"></div><span class="muted" id="impulseCount"></span></div>
    <div class="muted" id="impulseEffect"></div>
    <ul class="list" id="impulseList"></ul>
  </section>
</main>

<nav class="bottom-bar"><div class="inner" id="bottomBar"></div></nav>

<script>
/* 데이터는 팀 index.html과 같은 localStorage 키("data")를 읽습니다.
   { goal:{name,target,saved,deadline,income}, resisted:[{item,amount,date}], impulse:[...], history:[...] } */
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const todayStr = () => new Date().toISOString().slice(0, 10);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 로그인 확인 ---------- */
function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
function logout() {
  try { localStorage.removeItem("currentUser"); sessionStorage.removeItem("currentUser"); } catch {}
  location.href = "login.html";
}
const user = getCurrentUser();
if (!user) location.replace("login.html");

/* ---------- 하단 네비게이션 ---------- */
/* 그룹/AI 채팅은 index.html의 탭(#주소로 지정), 마이는 mypage.html 입니다. */
const pages = [
  { icon: "🏠", name: "홈", href: "home.html", active: true },
  { icon: "👥", name: "그룹", href: "index.html#group" },
  { icon: "👤", name: "마이", href: "mypage.html" },
  { icon: "💬", name: "AI 채팅", href: "index.html#chat" },
];
$("bottomBar").innerHTML = pages
  .map((p) => `<a href="${p.href}" class="${p.active ? "active" : ""}"><span>${p.icon}</span>${p.name}</a>`).join("");

/* ---------- 홈 화면 ---------- */
function renderHome() {
  $("welcome").textContent = `${user.name}님, 오늘도 한 걸음`;
  const data = load("data", null);

  // 아직 목표가 없으면 안내만 보여줘요
  if (!data || !data.goal) {
    $("goalCard").innerHTML = `<h3>저축 목표</h3><p class="muted">아직 목표가 없어요.</p><a class="btn" href="mypage.html#goal">목표 설정하러 가기</a>`;
    $("savedNow").textContent = won(0); $("monthlyNeed").textContent = "";
    $("resistedTotal").textContent = won(0); $("resistedCount").textContent = "";
    $("impulseTotal").textContent = won(0); $("impulseCount").textContent = "";
    $("impulseEffect").textContent = "이번 달 충동구매가 없습니다.";
    return;
  }

  const g = data.goal;
  const pct = g.target ? Math.min((g.saved / g.target) * 100, 100) : 0;
  const remaining = Math.max(g.target - g.saved, 0);
  // 기한이 없으면 월 소득의 20%를 저축한다고 가정
  const monthlyNeed = g.deadline
    ? remaining / Math.max((new Date(g.deadline) - new Date(todayStr())) / 86400000 / 30, 0.1)
    : (g.income || 0) * 0.2;

  $("goalCard").innerHTML = `
    <h3>저축 목표</h3>
    <div class="row"><b>${esc(g.name)}</b><span class="muted">${g.deadline ? "기한 " + esc(g.deadline) : "기한 없음"}</span></div>
    <div class="big">${won(g.target)}</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row"><span class="muted">${pct.toFixed(1)}% 달성</span><span class="muted">남은 금액 ${won(remaining)}</span></div>`;

  $("savedNow").textContent = won(g.saved);
  $("monthlyNeed").textContent = g.deadline ? `월 ${won(monthlyNeed)} 저축 필요` : `월 소득의 20%(${won(monthlyNeed)}) 저축 가정`;

  const resisted = data.resisted || [];
  $("resistedTotal").textContent = won(resisted.reduce((s, x) => s + x.amount, 0));
  $("resistedCount").textContent = `구매를 참은 ${resisted.length}건`;

  const month = todayStr().slice(0, 7);
  const imp = (data.impulse || []).filter((x) => x.date.slice(0, 7) === month);
  const total = imp.reduce((s, x) => s + x.amount, 0);
  $("impulseTotal").textContent = won(total);
  $("impulseCount").textContent = `${imp.length}건`;
  const delay = total / Math.max(monthlyNeed / 30, 1);
  $("impulseEffect").textContent = total
    ? `이 돈을 저축했다면 목표 달성이 약 ${Math.round(delay)}일 빨랐습니다.`
    : "이번 달 충동구매가 없습니다.";
  $("impulseList").innerHTML = imp.slice().reverse()
    .map((x) => `<li><span>${esc(x.item)}</span><span class="bad">-${won(x.amount)}</span></li>`).join("");
}
if (user) renderHome();
</script>
</body>
</html>
