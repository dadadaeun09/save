<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈모으기운동 - 홈</title>
<style>
  :root {
    --green: #4caf7d; --green-dark: #3d9468; --pastel: #6fb98f; --pastel-text: #5a9e78;
    --pastel-light: #cfe9da; --pastel-bg: #f1f9f4; --white: #fff; --gray: #8a9a91; --red: #e57373;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--pastel-text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  a { color: var(--green); text-decoration: none; }
  h2, h3 { color: var(--green); margin: 0 0 10px; }
  h3 { font-size: 16px; }

  /* 상단바 + 석 삼 자 메뉴 */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--white); border-bottom: 2px solid var(--pastel-light); }
  .logo { font-size: 20px; font-weight: 700; color: var(--green); }
  .menu-button { width: 40px; height: 40px; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 5px; padding: 0; border: 0; border-radius: 10px; background: none; cursor: pointer; }
  .menu-button span { display: block; width: 22px; height: 3px; border-radius: 2px; background: var(--green); }
  .menu-button:hover { background: var(--pastel-bg); }
  .dropdown { display: none; position: absolute; top: 100%; right: 16px; min-width: 160px; padding: 8px;
    background: var(--white); border: 2px solid var(--pastel-light); border-radius: 14px; }
  .dropdown.open { display: block; }
  .dropdown a, .dropdown button { display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; text-align: left; font: inherit; color: var(--pastel-text); cursor: pointer; }
  .dropdown a.active, .dropdown a:hover, .dropdown button:hover { background: var(--pastel-bg); color: var(--green); font-weight: 700; }
  .dropdown hr { border: 0; border-top: 1px dashed var(--pastel-light); margin: 6px 0; }

  /* 하단 이동바 */
  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
    background: var(--white); border-top: 2px solid var(--pastel-light); padding-bottom: env(safe-area-inset-bottom); }
  .bottom-bar a { flex: 1; padding: 16px 4px; text-align: center; color: var(--pastel-text); white-space: nowrap; }
  .bottom-bar a.active, .bottom-bar a:hover { background: var(--pastel-bg); color: var(--green); font-weight: 700; }

  /* 본문 */
  main { max-width: 720px; margin: 0 auto; padding: 22px 16px 100px; }
  .card { border: 2px solid var(--pastel-light); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card.soft { background: var(--pastel-bg); border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .grid .card { margin-bottom: 0; }
  .muted { color: var(--gray); font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; color: var(--green); }
  .big.red { color: var(--red); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .progress { height: 14px; background: var(--pastel-light); border-radius: 999px; overflow: hidden; margin: 10px 0; }
  .progress i { display: block; height: 100%; width: 0; background: var(--green); transition: width .5s; }
  ul.list { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px dashed var(--pastel-light); font-size: 14px; }
  ul.list li:first-child { border-top: 0; }
  .bad { color: var(--red); }
  .btn { display: inline-block; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--green); color: #fff; }
  .btn:hover { background: var(--green-dark); }
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="home.html">돈모으기운동</a>
  <button class="menu-button" id="menuButton" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  <div class="dropdown" id="dropdown"></div>
</header>

<main>
  <h2 id="welcome"></h2>

  <section class="card soft" id="goalCard"></section>

  <div class="grid">
    <section class="card">
      <h3>현재 저축액</h3>
      <div class="big" id="savedNow"></div>
      <div class="muted" id="monthlyNeed"></div>
    </section>
    <section class="card">
      <h3>아낀 금액</h3>
      <div class="big" id="resistedTotal"></div>
      <div class="muted" id="resistedCount"></div>
    </section>
  </div>

  <section class="card">
    <h3>이번 달 충동구매</h3>
    <div class="row"><div class="big red" id="impulseTotal"></div><span class="muted" id="impulseCount"></span></div>
    <div class="muted" id="impulseEffect"></div>
    <ul class="list" id="impulseList"></ul>
  </section>
</main>

<nav class="bottom-bar" id="bottomBar"></nav>

<script>
/* 데이터는 팀 index.html과 같은 localStorage 키("data")를 읽습니다.
   { goal:{name,target,saved,deadline,income}, resisted:[{item,amount,date}], impulse:[...], history:[...] } */
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const todayStr = () => new Date().toISOString().slice(0, 10);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 로그인 확인 ---------- */
function getCurrentUser() {
  try {
    const t = sessionStorage.getItem("currentUser") || localStorage.getItem("currentUser");
    return t ? JSON.parse(t) : null;
  } catch { return null; }
}
function logout() {
  try { localStorage.removeItem("currentUser"); sessionStorage.removeItem("currentUser"); } catch {}
  location.href = "login.html";
}
const user = getCurrentUser();
if (!user) location.replace("login.html");

/* ---------- 메뉴 (하단바 + 석 삼 자 목록) ---------- */
/* 그룹/AI 채팅은 index.html의 탭(#주소로 지정), 마이는 mypage.html 입니다. */
const pages = [
  { name: "홈", href: "home.html", active: true },
  { name: "그룹", href: "index.html#group" },
  { name: "마이", href: "mypage.html" },
  { name: "AI 채팅", href: "index.html#chat" },
];
const links = pages.map((p) => `<a href="${p.href}" class="${p.active ? "active" : ""}">${p.name}</a>`).join("");
$("bottomBar").innerHTML = links;
$("dropdown").innerHTML = links + `<hr><button type="button" onclick="logout()">로그아웃</button>`;
$("menuButton").onclick = (e) => { e.stopPropagation(); $("dropdown").classList.toggle("open"); };
document.addEventListener("click", () => $("dropdown").classList.remove("open"));

/* ---------- 홈 화면 ---------- */
function renderHome() {
  $("welcome").textContent = `${user.name}님, 오늘도 한 걸음`;
  const data = load("data", null);

  // 아직 목표가 없으면 안내만 보여줘요
  if (!data || !data.goal) {
    $("goalCard").innerHTML = `<h3>저축 목표</h3><p class="muted">아직 목표가 없어요.</p><a class="btn" href="mypage.html#goal">목표 설정하러 가기</a>`;
    $("savedNow").textContent = won(0); $("monthlyNeed").textContent = "";
    $("resistedTotal").textContent = won(0); $("resistedCount").textContent = "";
    $("impulseTotal").textContent = won(0); $("impulseCount").textContent = "";
    $("impulseEffect").textContent = "이번 달 충동구매가 없습니다.";
    return;
  }

  const g = data.goal;
  const pct = Math.min((g.saved / g.target) * 100, 100);
  const remaining = Math.max(g.target - g.saved, 0);
  const daysLeft = (new Date(g.deadline) - new Date(todayStr())) / 86400000;
  const monthsLeft = Math.max(daysLeft / 30, 0.1);
  const monthlyNeed = remaining / monthsLeft;

  $("goalCard").innerHTML = `
    <h3>저축 목표</h3>
    <div class="row"><b>${esc(g.name)}</b><span class="muted">기한 ${esc(g.deadline)}</span></div>
    <div class="big">${won(g.target)}</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row"><span class="muted">${pct.toFixed(1)}% 달성</span><span class="muted">남은 금액 ${won(remaining)}</span></div>`;

  $("savedNow").textContent = won(g.saved);
  $("monthlyNeed").textContent = `월 ${won(monthlyNeed)} 저축 필요`;

  const resisted = data.resisted || [];
  $("resistedTotal").textContent = won(resisted.reduce((s, x) => s + x.amount, 0));
  $("resistedCount").textContent = `구매를 참은 ${resisted.length}건`;

  const month = todayStr().slice(0, 7);
  const imp = (data.impulse || []).filter((x) => x.date.slice(0, 7) === month);
  const total = imp.reduce((s, x) => s + x.amount, 0);
  $("impulseTotal").textContent = won(total);
  $("impulseCount").textContent = `${imp.length}건`;
  const delay = total / Math.max(monthlyNeed / 30, 1);
  $("impulseEffect").textContent = total
    ? `이 돈을 저축했다면 목표 달성이 약 ${Math.round(delay)}일 빨랐습니다.`
    : "이번 달 충동구매가 없습니다.";
  $("impulseList").innerHTML = imp.slice().reverse()
    .map((x) => `<li><span>${esc(x.item)}</span><span class="bad">-${won(x.amount)}</span></li>`).join("");
}
if (user) renderHome();
</script>
</body>
</html>
